name: Build & Release

env:
  GH_TOKEN: ${{ SECRETS.GITHUB_TOKEN }}

on:
  push:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Resolve release tag from package.json
        id: meta
        run: |
          # electron-builder derives its release tag from the package.json version
          # (v<version>); resolve the same value so we can create the release up front.
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create the draft release up front
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # The build matrix runs in parallel and each electron-builder invocation
          # would otherwise create its own draft release, racing into duplicate
          # drafts for the same tag. Creating it once here means every build job
          # just uploads its assets to the existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it."
          else
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "Automated release build."
          fi

  linux_x64:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: npm run install-all

      - name: Release
        if: contains(github.ref, 'master')
        run: npm run electron:dist:linux:x64 -- --publish always

  linux_arm64:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: npm run install-all

      - name: Release
        if: contains(github.ref, 'master')
        run: npm run electron:dist:linux:arm64 -- --publish always

  linux_arm:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: npm run install-all

      - name: Release
        if: contains(github.ref, 'master')
        run: npm run electron:dist:linux:arm -- --publish always

  dmg_x64:
    needs: prepare
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: npm run install-all

      # Notarization uses the App Store Connect API key. The .p8 is stored
      # base64-encoded in APPLE_API_KEY_CONTENT and decoded into a temp file.
      - name: Prepare Apple API key
        run: |
          echo "${{ secrets.APPLE_API_KEY_CONTENT }}" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      - name: Release
        if: contains(github.ref, 'master')
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run electron:dist:mac:x64 -- --publish always

  dmg_arm64:
    needs: prepare
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: npm run install-all

      # Notarization uses the App Store Connect API key. The .p8 is stored
      # base64-encoded in APPLE_API_KEY_CONTENT and decoded into a temp file.
      - name: Prepare Apple API key
        run: |
          echo "${{ secrets.APPLE_API_KEY_CONTENT }}" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      - name: Release
        if: contains(github.ref, 'master')
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run electron:dist:mac:arm64 -- --publish always

  mac_update_metadata:
    needs: [prepare, dmg_x64, dmg_arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Combine macOS update metadata
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          gh release download "$TAG" \
            --pattern "Storytel-Player-${VERSION}-mac-x64.zip" \
            --pattern "Storytel-Player-${VERSION}-mac-arm64.zip" \
            --dir mac-update
          node scripts/generate-mac-update.cjs "$VERSION" mac-update
          gh release upload "$TAG" mac-update/latest-mac.yml --clobber

  exe:
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: npm run install-all

      - name: Release
        if: contains(github.ref, 'master')
        run: npm run electron:dist:win -- --publish always
